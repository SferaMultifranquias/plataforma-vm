<div class="login-page min-h-full flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
        <span class="text-white font-bold text-2xl">SF</span>
      </div>
      <h1 class="text-white text-2xl font-bold">Sfera VM</h1>
      <p class="text-slate-400 text-sm mt-1">Pedidos e aprovações</p>
    </div>

    <form id="login-form" class="bg-white rounded-2xl shadow-2xl overflow-hidden">
      <div class="px-6 pt-6 pb-4 border-b border-slate-100">
        <h2 class="text-slate-900 font-semibold text-lg">Entrar</h2>
        <p class="text-slate-500 text-sm mt-1">Acesse sua conta para continuar.</p>
      </div>

      <div class="px-6 pt-4 pb-6 space-y-4">
        <div id="login-error" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-3 py-2" role="alert"></div>

        <div>
          <label class="form-label" for="login-email">Login</label>
          <div class="login-field">
            <i data-lucide="user" class="login-field-icon" aria-hidden="true"></i>
            <input id="login-email" type="email" class="login-input" placeholder="seu@email.com" autocomplete="email">
          </div>
        </div>

        <div>
          <label class="form-label" for="login-senha">Senha</label>
          <div class="login-field">
            <i data-lucide="lock" class="login-field-icon" aria-hidden="true"></i>
            <input id="login-senha" type="password" class="login-input pr-10" placeholder="********" autocomplete="current-password">
            <button id="login-toggle-senha" type="button" class="login-toggle" aria-label="Mostrar ou ocultar senha">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <button id="login-btn" type="submit" class="login-submit">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          <span>Entrar</span>
        </button>
      </div>
    </form>

    <p class="text-center text-slate-500 text-xs mt-4">Sfera Multifranquias - 2026</p>
  </div>
</div>
