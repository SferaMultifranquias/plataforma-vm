<div class="order-form-card bg-white rounded-2xl border border-slate-200 shadow-sm p-6 lg:p-8 mx-auto max-w-[1400px]">
  <div class="order-form-header flex items-start gap-4 mb-6">
    <div class="w-11 h-11 rounded-xl bg-blue-100 text-blue-700 flex items-center justify-center shrink-0">
      <i data-lucide="clipboard-list" class="w-5 h-5"></i>
    </div>
    <div class="min-w-0">
      <h2 class="text-lg font-semibold text-slate-900 leading-tight">Novo Pedido de Material VM</h2>
      <p class="text-sm text-slate-500 mt-1">Todos os campos marcados com * são obrigatórios</p>
    </div>
  </div>

  <div id="order-edit-banner" class="hidden mb-5 rounded-xl border border-violet-200 bg-violet-50 px-4 py-3 text-sm text-violet-800"></div>

  <form class="space-y-6" id="form-pedido" novalidate>
    <div class="order-form-grid grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="order-form-section">
        <label class="form-label">Loja <span class="text-red-500">*</span></label>
        <select class="form-select order-form-select" id="f-loja">
          <option value="">Selecione a loja...</option>
        </select>
        <p class="field-error hidden text-xs text-red-600 mt-1" data-error-for="f-loja"></p>
        <p id="store-status-message" class="text-xs text-slate-400 mt-1"></p>
      </div>

      <div class="order-form-section">
        <label class="form-label">Tipo de Produto <span class="text-red-500">*</span></label>
        <select id="f-tipo" class="form-select order-form-select">
          <option value="">Selecione...</option>
          <option value="Produto de Ciclo">Produto de Ciclo</option>
          <option value="Reposição">Reposição</option>
          <option value="Troca">Troca</option>
          <option value="Outro">Outro</option>
        </select>
        <p class="field-error hidden text-xs text-red-600 mt-1" data-error-for="f-tipo"></p>
      </div>
    </div>

    <div class="order-form-section rounded-2xl border border-slate-200 bg-slate-50 p-4 space-y-3">
      <div class="flex items-center justify-between gap-4">
        <div>
          <label class="form-label mb-0">Itens do Pedido <span class="text-red-500">*</span></label>
        </div>
        <button type="button" id="btn-add-item" class="text-xs text-blue-600 hover:text-blue-700 font-medium inline-flex items-center gap-1">
          <i data-lucide="plus" class="w-3 h-3"></i> Adicionar item
        </button>
      </div>

      <div id="items-count" class="text-xs text-slate-400"></div>
      <div id="items-container" class="space-y-3">
        <div class="text-xs text-slate-400">Carregando itens...</div>
      </div>
      <p class="field-error hidden text-xs text-red-600 mt-1" data-error-for="items"></p>
    </div>

    <div class="order-form-section">
      <label class="form-label">Motivo da Solicitação <span class="text-red-500">*</span></label>
      <select id="f-motivo" class="form-select order-form-select">
        <option value="">Selecione o motivo...</option>
        <option value="Falta de estoque">Falta de estoque</option>
        <option value="Produto danificado">Produto danificado</option>
        <option value="Reposição operacional">Reposição operacional</option>
        <option value="Outro">Outro</option>
      </select>
      <p class="field-error hidden text-xs text-red-600 mt-1" data-error-for="f-motivo"></p>
      <textarea id="f-justification" class="hidden" aria-hidden="true"></textarea>
    </div>

    <div class="order-form-section">
      <label class="form-label">Fotos do Produto <span class="text-red-500">*</span></label>
      <input id="foto-input" type="file" accept="image/*" multiple class="hidden">
      <div id="upload-area" class="order-upload-area group border-2 border-dashed border-slate-300 rounded-2xl bg-white px-6 py-10 text-center cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-colors">
        <div class="mx-auto w-12 h-12 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center mb-3">
          <i data-lucide="camera" class="w-5 h-5"></i>
        </div>
        <div id="image-upload-label" class="text-sm font-medium text-slate-800">Adicionar imagens</div>
        <div class="text-xs text-slate-500 mt-1">Múltiplas imagens permitidas. JPEG, PNG ou WebP, até 5 MB cada.</div>
        <div class="mt-4 flex flex-wrap justify-center gap-3 text-xs text-slate-500">
          <span>✓ Referência visível</span>
          <span>✓ Sem reflexo</span>
          <span>✓ Foco na etiqueta</span>
        </div>
      </div>
      <div id="image-gallery" class="hidden mt-3">
        <div class="text-xs font-medium text-slate-500 mb-2" id="image-gallery-count"></div>
        <div id="image-gallery-container" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3"></div>
      </div>
      <div id="edit-images-section" class="hidden mt-3 rounded-xl border border-slate-200 bg-slate-50 p-3">
        <div class="text-xs font-medium text-slate-500 mb-2">Imagens existentes</div>
        <div id="edit-images-container" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3"></div>
      </div>
      <p class="field-error hidden text-xs text-red-600 mt-1" data-error-for="foto"></p>
    </div>

    <div class="order-form-actions border-t border-slate-200 pt-5 flex flex-col-reverse sm:flex-row sm:justify-end gap-3">
      <button type="button" id="btn-clear-form" class="order-form-action order-form-action--secondary justify-center">
        <i data-lucide="x" class="w-4 h-4"></i> Limpar
      </button>
      <button type="submit" id="btn-submit-form" class="order-form-action order-form-action--primary justify-center">
        <i data-lucide="send" class="w-4 h-4"></i> <span id="btn-submit-label">Enviar Pedido</span>
      </button>
    </div>
  </form>
</div>
